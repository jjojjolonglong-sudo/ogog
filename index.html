<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>멀티 데스크 통합 작업실 대시보드</title>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- GoldenLayout v1.59 CSS -->
    <link type="text/css" rel="stylesheet" href="https://golden-layout.com/files/latest/css/goldenlayout-base.css" />
    <link type="text/css" rel="stylesheet" href="https://golden-layout.com/files/latest/css/goldenlayout-dark-theme.css" />
    
    <!-- GoldenLayout v1.59 JS -->
    <script type="text/javascript" src="https://golden-layout.com/files/latest/js/goldenlayout.min.js"></script>

    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; background: #1e1e1e; color: #eee; overflow: hidden; }
        
        /* 슬림해진 상단 툴바 */
        #toolbar { background: #2d2d2d; padding: 6px 15px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; z-index: 1000; flex-wrap: wrap; }
        #toolbar h3 { margin: 0; font-size: 14px; color: #fff; margin-right: 4px; }
        
        /* 데스크 버튼 영역 컨테이너 */
        #deskTabsContainer { display: flex; gap: 4px; align-items: center; }
        .desk-tab { background: #3a3a3a; color: #aaa; border: 1px solid #555; padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .desk-tab:hover { background: #4a4a4a; color: #fff; }
        .desk-tab.active { background: #007acc; color: #fff; border-color: #005f99; }

        #toolbar button { padding: 4px 10px; background: #007acc; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold; }
        #toolbar button:hover { background: #005f99; }
        #toolbar button.active { background: #d9534f; }
        
        .toolbar-divider { width: 1px; height: 16px; background: #555; margin: 0 4px; }
        #toolbar .hint { font-size: 11px; color: #aaa; margin-left: auto; }

        #layoutContainer { flex: 1; width: 100%; height: 100%; position: relative; }

        /* 개별 앱 패널 스타일 */
        .app-panel { width: 100%; height: 100%; display: flex; flex-direction: column; background: #252526; overflow: hidden; }
        .app-header { background: #333; padding: 4px 8px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        .app-header input { flex: 1; background: #1e1e1e; color: #fff; border: 1px solid #555; padding: 3px 6px; border-radius: 3px; font-size: 11px; }
        .app-header button { background: #007acc; color: #fff; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .app-body { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }

        /* 고정 모드일 때 숨기기 및 분할선(스플리터) 마우스 조작 차단 */
        body.locked .app-header { display: none; }
        body.locked .lm_header { display: none !important; }
        body.locked .lm_splitter { pointer-events: none !important; }
        
        /* 수정모드 전용 컨트롤 */
        .edit-only { display: none; }
        body:not(.locked) .edit-only { display: inline-block; }
    </style>
</head>
<body>

    <div id="toolbar">
        <h3>작업실</h3>
        
        <!-- 데스크 버튼들이 나열될 영역 -->
        <div id="deskTabsContainer"></div>
        <button id="addDeskBtn" onclick="addNewDesk()" title="새 데스크 추가 (최대 5개)">+</button>
        
        <div class="toolbar-divider"></div>

        <button id="addPaneBtn" class="edit-only" onclick="addNewPane()">+ 창 추가</button>
        <button id="modeBtn" onclick="toggleEditMode()">수정모드 진입</button>
        <button onclick="saveMyLayout()">수동 저장</button>
        
        <!-- 초기화 버튼은 수정모드일 때만 노출 -->
        <button class="edit-only" onclick="resetCurrentDesk()" style="background:#d9534f;">이 데스크 초기화</button>
        
        <span class="hint" id="modeHint">고정 모드 (창 및 주소 수정 불가)</span>
    </div>

    <div id="layoutContainer"></div>

    <script>
        let myLayout;
        let isLocked = true;
        let paneCounter = 1;
        
        const STORAGE_KEY = 'multi_desk_dashboard_permanent_key';

        let appData = {
            currentDeskId: 'desk_1',
            desks: {
                'desk_1': {
                    name: '데스크1',
                    config: getDefaultConfig()
                }
            }
        };

        function getDefaultConfig() {
            return {
                settings: {
                    hasHeaders: true,
                    reorderEnabled: true,
                    selectionEnabled: false,
                    popoutWholeStack: false,
                    blockedPopoutsThrowError: true,
                    closePopoutsOnUnload: true,
                    showPopoutIcon: false,
                    showMaximiseIcon: true,
                    showCloseIcon: true
                },
                content: [{
                    type: 'row',
                    content: [{
                        type: 'stack',
                        content: [{
                            type: 'component',
                            componentName: 'AppViewer',
                            title: '작업창 1',
                            componentState: { url: '' }
                        }]
                    }]
                }]
            };
        }

        $(function() {
            loadAppData();
            updateDeskTabsUI();
            renderCurrentDesk();
        });

        function loadAppData() {
            let saved = localStorage.getItem(STORAGE_KEY);
            if(saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if(parsed && parsed.desks && parsed.currentDeskId) {
                        appData = parsed;
                        return;
                    }
                } catch(e) {
                    console.error("데이터 로드 실패:", e);
                }
            }

            // 구버전 키 데이터 마이그레이션 시도
            let oldKeys = ['multi_desk_dashboard_data_v1', 'pro_dashboard_layout_unified', 'pro_dashboard_layout_v6'];
            for(let oldKey of oldKeys) {
                let oldData = localStorage.getItem(oldKey);
                if(oldData) {
                    try {
                        let parsedOld = JSON.parse(oldData);
                        if(parsedOld.desks) {
                            appData = parsedOld;
                            saveAppDataToStorage();
                            return;
                        } else if(parsedOld.content) {
                            appData.desks['desk_1'].config = parsedOld;
                            saveAppDataToStorage();
                            return;
                        }
                    } catch(e) {}
                }
            }
        }

        function saveAppDataToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function updateDeskTabsUI() {
            let $container =$('#deskTabsContainer');
            $container.empty();

            let deskIds = Object.keys(appData.desks);

            deskIds.forEach(id => {
                let desk = appData.desks[id];
                let activeClass = (id === appData.currentDeskId) ? 'active' : '';
                
                let $tab =$(`<button class="desk-tab ${activeClass}" title="클릭하여 전환 / 더블클릭하여 이름 변경">${desk.name}</button>`);
                
                // 단일 클릭: 데스크 전환
                $tab.on('click', function() {
                    if(id !== appData.currentDeskId) {
                        saveCurrentLayoutState();
                        appData.currentDeskId = id;
                        saveAppDataToStorage();
                        updateDeskTabsUI();
                        renderCurrentDesk();
                    }
                });

                // 더블 클릭: 데스크 이름 변경
                $tab.on('dblclick', function(e) {
                    e.stopPropagation();
                    let newName = prompt("변경할 데스크 이름을 입력하세요:", desk.name);
                    if(newName && newName.trim() !== "") {
                        desk.name = newName.trim();
                        saveAppDataToStorage();
                        updateDeskTabsUI();
                    }
                });

                $container.append($tab);
            });

            // 최대 5개 도달 시 + 버튼 숨기기
            if(deskIds.length >= 5) {
                $('#addDeskBtn').hide();
            } else {
                $('#addDeskBtn').show();
            }
        }

        function renderCurrentDesk() {
            if(myLayout) {
                myLayout.destroy();
                $('#layoutContainer').empty();
            }

            let desk = appData.desks[appData.currentDeskId];
            if(!desk) {
                appData.currentDeskId = Object.keys(appData.desks)[0];
                desk = appData.desks[appData.currentDeskId];
            }

            myLayout = new GoldenLayout(desk.config, $('#layoutContainer'));

            myLayout.registerComponent('AppViewer', function(container, state) {
                let $el = container.getElement();
                let currentUrl = state.url || '';
                
                $el.html(`
    <div class="app-panel">
        <div class="app-header">
            <input type="text" class="url-input" value="${currentUrl}" placeholder="https:// 주소 입력">
            <button class="load-btn">적용</button>
        </div>
        <iframe class="app-body" src="${currentUrl}" allow="clipboard-read; clipboard-write; camera; microphone; geolocation; storage-access"></iframe>
    </div>
`);

                let $input =$el.find('.url-input');
                let $iframe =$el.find('.app-body');
                let $btn =$el.find('.load-btn');

                function applyUrl() {
                    let url = $input.val().trim();
                    if(url && !url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                        $input.val(url);
                    }
                    $iframe.attr('src', url);
                    container.setState({ url: url });
                }

                $btn.on('click', applyUrl);$input.on('keypress', function(e) {
                    if(e.which === 13) applyUrl();
                });

                // 입력창 이벤트가 GoldenLayout으로 새어나가지 않도록 차단하는 코드 추가
$input.on('mousedown click keydown keypress', function(e) {
    e.stopPropagation();
});
            });

            myLayout.init();

            $(window).resize(function() {
                myLayout.updateSize();
            });

            applyLockState(isLocked);
        }

        function saveCurrentLayoutState() {
            if(myLayout) {
                let layoutState = myLayout.toConfig();
                appData.desks[appData.currentDeskId].config = layoutState;
            }
        }

        function addNewDesk() {
            let deskIds = Object.keys(appData.desks);
            if(deskIds.length >= 5) {
                alert('데스크는 최대 5개까지만 생성할 수 있습니다.');
                return;
            }

            let newId = 'desk_' + Date.now();
            let count = deskIds.length + 1;
            let newName = prompt("새 데스크 이름을 입력하세요:", `데스크${count}`);
            if(!newName) return;

            saveCurrentLayoutState();
            
            appData.desks[newId] = {
                name: newName.trim(),
                config: getDefaultConfig()
            };
            appData.currentDeskId = newId;

            saveAppDataToStorage();
            updateDeskTabsUI();
            renderCurrentDesk();
        }

        function addNewPane() {
            paneCounter++;
            const newItemConfig = {
                type: 'component',
                componentName: 'AppViewer',
                title: `작업창 ${paneCounter}`,
                componentState: { url: '' }
            };

            let targetStack = findFirstStack(myLayout.root);
            if (targetStack) {
                targetStack.addChild(newItemConfig);
            } else {
                myLayout.root.addChild(newItemConfig);
            }
        }

        function findFirstStack(item) {
            if (item.isStack) return item;
            if (item.contentItems) {
                for (let i = 0; i < item.contentItems.length; i++) {
                    let found = findFirstStack(item.contentItems[i]);
                    if (found) return found;
                }
            }
            return null;
        }

        function toggleEditMode() {
            applyLockState(!isLocked);
        }

        function applyLockState(lock) {
            isLocked = lock;
            let $btn =$('#modeBtn');
            let $hint =$('#modeHint');

            if(isLocked) {
                $btn.text('수정모드 진입').removeClass('active');
                $hint.text('고정 모드 (창 및 주소 수정 불가)');
                $('body').addClass('locked');
                saveMyLayout(); 
            } else {
                $btn.text('고정하기 (완료)').addClass('active');
                $hint.text('수정모드 활성 (창 추가, 주소 변경, 레이아웃 조절 가능)');
                $('body').removeClass('locked');
            }
            myLayout.updateSize();
        }

        function saveMyLayout() {
            if(myLayout) {
                saveCurrentLayoutState();
                saveAppDataToStorage();
                alert(`"${appData.desks[appData.currentDeskId].name}" 데스크의 레이아웃과 주소가 안전하게 저장되었습니다!`);
            }
        }

        function resetCurrentDesk() {
            let deskName = appData.desks[appData.currentDeskId].name;
            if(confirm(`"${deskName}" 데스크를 초기 상태로 되돌리시겠습니까?`)) {
                appData.desks[appData.currentDeskId].config = getDefaultConfig();
                saveAppDataToStorage();
                renderCurrentDesk();
                alert(`"${deskName}" 데스크가 초기화되었습니다.`);
            }
        }
    </script>
</body>
</html>
